name: Build y pruebas

on:
  # push solo en master: en las ramas de los PR ya corre por pull_request
  # (si no, cada PR ejecutaría el workflow dos veces).
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore JwtExample.slnx

      - name: Formato (dotnet format)
        run: dotnet format JwtExample.slnx --no-restore --verify-no-changes

      - name: Compilar (advertencias como errores)
        run: dotnet build JwtExample.slnx --no-restore -warnaserror

      - name: Pruebas
        run: dotnet test JwtExample.slnx --no-build

      - name: Paquetes con vulnerabilidades conocidas
        run: |
          dotnet list JwtExample.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  docker:
    # Construye las imágenes y levanta el stack con docker compose. Así se
    # prueban de verdad los Dockerfiles (y los PR de Dependabot que cambian sus
    # imágenes base) y que los health checks respondan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir y levantar
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs

      - name: Detener
        if: always()
        run: docker compose down --volumes
