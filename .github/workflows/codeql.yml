name: CodeQL

on:
  # push solo en master: en las ramas de los PR ya corre por pull_request
  # (si no, cada PR ejecutaría el workflow dos veces).
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
