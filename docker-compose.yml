# Levanta las dos aplicaciones (API + front Blazor) en una red compartida.
#
#   docker compose up --build
#
# Front:   http://localhost:5070
# API:     http://localhost:5274/swagger
#
# Dentro de la red de compose el front llama a la API por el nombre del servicio
# (http://api:8080), no por localhost.

services:
  api:
    build:
      context: .
      dockerfile: JwtAuthApi/Dockerfile
    ports:
      - "5274:8080"
    environment:
      # Development habilita Swagger UI. Ninguna clave se versiona: si
      # JWT_SIGNING_KEY no está definida (p. ej. en un archivo .env), la API
      # genera una aleatoria al arrancar. Fuera de Development es obligatoria.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
    healthcheck:
      # La imagen de .NET no trae curl: se consulta /health con bash y /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: JwtAuthImplFront/Dockerfile
    ports:
      - "5070:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # El front (Blazor Server) llama a la API desde dentro del contenedor,
      # por eso usa el DNS del servicio de compose y no localhost.
      ApiBaseUrl: "http://api:8080"
      # Claves de Data Protection persistidas en un volumen: así reiniciar el
      # contenedor no invalida los tokens cifrados que guarda el navegador.
      DataProtection__KeysPath: /home/app/keys
    volumes:
      - front-keys:/home/app/keys
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  front-keys:
